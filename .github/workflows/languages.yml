name: Refresh languages card

on:
  schedule:
    - cron: "23 6 * * 1" # Mondays, 06:23 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Recount languages and rebuild the card
        run: python3 build.py --refresh
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Commit if the numbers moved
        run: |
          if git diff --quiet -- languages.json; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add languages.json README.md assets/languages-dark.svg assets/languages-light.svg
          git commit -m "Refresh languages card"
          git push
