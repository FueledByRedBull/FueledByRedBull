<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="640" height="240" role="img" aria-label="tarnisheds-arsenal: stats rebalancing while the attack rating climbs"><title>tarnisheds-arsenal: stats rebalancing while the attack rating climbs</title><style>.r{transform-box:fill-box;transform-origin:0 50%;animation:4s cubic-bezier(0.77,0,0.175,1) infinite alternate}.r0{transform:scaleX(0.8);animation-name:r0}@keyframes r0{0%,30%{transform:scaleX(0.45)}70%,100%{transform:scaleX(0.8)}}.r1{transform:scaleX(0.4);animation-name:r1}@keyframes r1{0%,30%{transform:scaleX(0.85)}70%,100%{transform:scaleX(0.4)}}.r2{transform:scaleX(0.65);animation-name:r2}@keyframes r2{0%,30%{transform:scaleX(0.3)}70%,100%{transform:scaleX(0.65)}}.r3{transform:scaleX(0.35);animation-name:r3}@keyframes r3{0%,30%{transform:scaleX(0.6)}70%,100%{transform:scaleX(0.35)}}.r4{transform:scaleX(0.95);animation-name:r4}@keyframes r4{0%,30%{transform:scaleX(0.55)}70%,100%{transform:scaleX(0.95)}}.h{animation:h 5s ease infinite}@keyframes h{0%,12%,100%{opacity:.7}5%{opacity:1}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="0.5" y="0.5" width="639" height="239" rx="14" fill="#f6f8fa" stroke="#d0d7de"/><g fill="#1f2328"><rect class="h" x="120" y="50" width="10" height="10" style="animation-delay:480ms"/><rect class="h" x="110" y="60" width="30" height="10" style="animation-delay:420ms"/><rect class="h" x="110" y="70" width="30" height="10" style="animation-delay:360ms"/><rect class="h" x="110" y="80" width="30" height="10" style="animation-delay:300ms"/><rect class="h" x="110" y="90" width="30" height="10" style="animation-delay:240ms"/><rect class="h" x="110" y="100" width="30" height="10" style="animation-delay:180ms"/><rect class="h" x="110" y="110" width="30" height="10" style="animation-delay:120ms"/><rect class="h" x="110" y="120" width="30" height="10" style="animation-delay:60ms"/><rect class="h" x="110" y="130" width="30" height="10" style="animation