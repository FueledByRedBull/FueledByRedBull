<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="640" height="240" role="img" aria-label="Twitch-Miner-Rust: points filling up until a bonus is claimed"><title>Twitch-Miner-Rust: points filling up until a bonus is claimed</title><style>.p{transform-box:fill-box;transform-origin:0 50%;animation:p 7s steps(22,end) infinite}.q{transform-box:fill-box;transform-origin:50% 50%;animation:q 7s cubic-bezier(0.23,1,0.32,1) infinite}.u{opacity:0;animation:u 7s cubic-bezier(0.23,1,0.32,1) infinite}@keyframes p{0%{transform:scaleX(0)}72%,100%{transform:scaleX(1)}}@keyframes q{0%,71%{opacity:.4;transform:scale(1)}74%{opacity:1;transform:scale(1.1)}80%,96%{opacity:1;transform:scale(1)}100%{opacity:.4;transform:scale(1)}}@keyframes u{0%,73%{opacity:0;transform:translateY(0)}77%{opacity:1}92%,100%{opacity:0;transform:translateY(-30px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="0.5" y="0.5" width="639" height="239" rx="14" fill="#f6f8fa" stroke="#d0d7de"/><rect x="100" y="170" width="440" height="20" fill="#d0d7de"/><rect class="p" x="100" y="170" width="440" height="20" fill="#8250df"/><g class="q" fill="#8250df"><rect x="310" y="60" width="20" height="10"/><rect x="300" y="70" width="40" height="10"/><rect x="290" y="80" width="60" height="10"/><rect x="280" y="90" width="80" height="10"/><rect x="280" y="100" width="80" height="10"/><rect x="290" y="110" width="60" height="10"/><rect x="300" y="120" width="40" height="10"/><rect x="310" y="130" width="20" height="10"/></g><g class="u" fill="#1f2328"><rect x="380" y="80" width="30" height="10"/><rect x="390" y="70" width="10" height="30"/></g><pattern id="m" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M0 9h10M9 0v10" stroke="#f6f8fa" stroke-width="2"/></pattern><rect x="40" y="20" width="560" height="200" fill="url(#m)"/></svg>
